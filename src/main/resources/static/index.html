<!DOCTYPE html>
<html style="height:100%">
<head>
    <title>TableCraft</title>
    <link rel="stylesheet" type="text/css" href="css/common.css">
    <link rel="stylesheet" type="text/css" href="css/topbar.css">
    <link rel="stylesheet" type="text/css" href="css/dialogs.css">
    <link rel="stylesheet" type="text/css" href="css/spreadsheet.css">
    <link rel="stylesheet" type="text/css" href="css/sidepanel.css">
    <link rel="icon" type="image/png" href="TableCraft.png" />
    <style>
        @import url('fonts/PTSansNarrow-Regular.ttf');
        @import url('fonts/PTSansNarrow-Bold.ttf');
    </style>

</head>
<body style="width:100%; height:100%; border:0; padding:0; margin:0; display: flex;  flex-direction: column;">
    <div id="topBar">


    </div>
    <div style="display:flex; flex-grow: 1; height: 0">
        <div id="spreadsheetViewport" style="flex-grow: 1; height:100%; overflow: scroll" >
            <table id="spreadsheetTable">
                <thead><tr id="spreadsheetTHead"></tr></thead>
            <tbody id="spreadsheetTBody"></tbody>
            </table>
        </div>

        <div id="divider" style='height:100%; flex: 0 0 12px; background-image: url("dotted.jpeg")'></div>

        <div id="sidePanel" style="height: 100%; flex: 0 0 200px; overflow: auto">
            <div style="height:40px;display:flex">
            <select id="panelSelect" style="height:40px;flex-grow: 1">
                <option>About</option>
                <option value="Details" selected="selected">Cell Details</option>
                <option value="Function">Functions</option>
                <option value="Integration">Integrations</option>
            </select>

            <select id="menuSelect" style="height:40px;width:40px">
                <option>☰</option>

                <option>Clear All</option>
                <option>Cut</option>
                <option>Copy</option>
                <option>Paste</option>
                <option>Load File</option>
                <option>Load Example</option>
                <option>Save File</option>
            </select>
            </div>

            <div id="AboutPanel" class="panelContainer">
                <h2>TableCraft</h2>

                    <center><img src="TableCraft.png" width="150" /></center>
                    Utilize a spreadsheet interface
                    to control simple IoT projects.
            </div>

            <div id="DetailsPanel" class="panelContainer">
                <h2 id="rangeName" ></h2>
                Value:<br>
                <input id="formulaInput" list="functions" style="width:100%">
                <datalist id="functions"></datalist>
                <p>
                <label>Input:<br>
                    <select id="inputType" style="width:100%">
                        <option>No User Input</option>
                        <option>Bool</option>
                        <option>String</option>
                        <option>Int</option>
                        <option>Real</option>
                    </select>
                </label>
                <div id="ValidationForm" style="margin-top:10px">
                </div>
                <div id="ValidationExplanation"></div>
                <p>
                <div>Style:</div>
                <div id="stylesDiv"></div>
                <div id="addStyleDiv" style="padding-bottom:5px;padding-top:5px">
                    <img src="img/add_circle.svg" style="float:left;padding-top:2px">
                    <div style="padding-left:20px">Add Style / Image</div>
                </div>

                <div id="globalErrorDiv" ></div>
            </div>

            <div id="FunctionPanel" class="panelContainer">
                <div id="operationEditorContainer" class="panelItemContainer"></div>
                <h2>All Functions</h2>
                <div id="operationListContainer" class="panelItemContainer"></div>
            </div>

            <div id="IntegrationPanel">
                <div id="integrationList" class="panelContainer"></div>
                <h2>Available Integrations</h2>
                <div id="integrationSpecList" class="panelContainer"></div>
            </div>
        </div>
    </div>
    <dialog id="dialog">
    </dialog>

    <dialog id="uploadDialog">
        <h2>Load File</h2>
        <div class="dialogFields">
            <label for="uploadFileInput"></label>
            <input id="uploadFileInput" type="file" />
        </div>
        <div class="dialogButtons">
            <button id="uploadButton">Load</button>
            <button id="uploadCancel">Cancel</button>
        </div>
    </dialog>

    <dialog id="downloadDialog">
        <h2>Save File</h2>
        <div class="dialogFields">
            <label for="downloadFileNameInput">File Name</label>
            <input id="downloadFileNameInput" value="data"/>
        </div>
        <div class="dialogButtons">
            <a href="data" download="data.tc" id="downloadLink">
                <button id="downloadButton">Save</button>
            </a>
            <button id="downloadCancel">Cancel</button>
        </div>
    </dialog>

    <dialog id="exampleDialog">
        <h2>Load Example</h2>
        <div class="dialogFields">
            <label for="exampleSelect">Examples</label>
            <select id="exampleSelect">
                <option>Mixer</option>
                <option>Multisensor</option>
                <option>Statemachine</option>
            </select>
        </div>
        <div class="dialogButtons">
            <button id="exampleButton">Load</button>
            <button id="exampleCancel">Cancel</button>
        </div>
    </dialog>

    <dialog id="sheetDialog">
        <h2 id="sheetDialogTitle">Sheet Metadata</h2>
        <div class="dialogFields">
            <label for="sheetNameInput">Name</label>
            <input id="sheetNameInput"  />
        </div>
        <div class="dialogButtons">
            <button id="sheetOkButton">Ok</button>
            <button id="sheetCancelButton">Cancel</button>
            <button id="sheetDeleteButton">Delete</button>
        </div>
    </dialog>

    <dialog id="alertDialog">
        <h2 id ="alertDialogTitle"></h2>
        <div id="alertDialogText"></div>
        <div class="dialogButtons">
            <button id="alertDialogOkButton">Ok</button>
        </div>
    </dialog>

    <dialog id="confirmDialog">
        <h2 id ="confirmDialogTitle"></h2>
        <div id="confirmDialogText"></div>
        <div class="dialogButtons">
            <button id="confirmDialogOkButton">Ok</button>
            <button id="confirmDialogCancelButton">Cancel</button>
        </div>
    </dialog>

    <dialog id="promptDialog">
        <h2 id ="promptDialogTitle"></h2>
        <div id="promptDialogContent"></div>
        <div class="dialogButtons">
            <button id="promptDialogOkButton">Ok</button>
            <button id="promptDialogCancelButton">Cancel</button>
        </div>
    </dialog>

    <dialog id="imageDialog">
        <h2>Select Image</h2>
        <div id="imageDialogContent" style="width: 400px; height:300px; overflow-y: auto">
        <details class="symbols" open="open">
            <summary>Lines</summary>
            <svg><use href="img/cell/line.svg#hb" /></svg>
            <svg><use href="img/cell/line.svg#h" /></svg>

            <svg><use href="img/cell/line.svg#br" /></svg>
            <svg><use href="img/cell/line.svg#bl" /></svg>

            <svg><use href="img/cell/line.svg#vr" /></svg>
            <svg><use href="img/cell/line.svg#vl" /></svg>

            <svg><use href="img/cell/line.svg#v" /></svg>
            <svg><use href="img/cell/line.svg#v" /></svg>

            <svg><use href="img/cell/line.svg#tr" /></svg>
            <svg><use href="img/cell/line.svg#tl" /></svg>

            <svg><use href="img/cell/line.svg#ht" /></svg>
            <svg><use href="img/cell/line.svg#hv" /></svg>

            <svg><use href="img/cell/line.svg#arc.dr" /></svg>
            <svg><use href="img/cell/line.svg#arc.dl" /></svg>
            <svg><use href="img/cell/line.svg#arc.ur" /></svg>
            <svg><use href="img/cell/line.svg#arc.ul" /></svg>

            <svg><use href="img/cell/line.svg#diagonal.dr" /></svg>
            <svg><use href="img/cell/line.svg#diagonal.dl" /></svg>
            <svg><use href="img/cell/line.svg#diagonal.ur" /></svg>
            <svg><use href="img/cell/line.svg#diagonal.ul" /></svg>
        </details>

        <details class="symbols">
            <summary>Arrows</summary>
            <svg><use href="img/cell/arrow.svg#l" /></svg>
            <svg><use href="img/cell/arrow.svg#r" /></svg>
            <svg><use href="img/cell/arrow.svg#u" /></svg>
            <svg><use href="img/cell/arrow.svg#d" /></svg>

        </details>

        <details class="symbols">
            <summary>Symbols</summary>
            <svg><use href="img/cell/symbol#lamp" /></svg>
            <svg><use href="img/cell/symbol#motor" /></svg>
            <svg><use href="img/cell/symbol#valve.v" /></svg>
            <svg><use href="img/cell/symbol#valve.h" /></svg>
            <svg><use href="img/cell/symbol#sensor.level.svg" /></svg>
                <svg><use href="img/cell/symbol#mixer.u" /></svg>
                <svg><use href="img/cell/symbol#mixer.d" /></svg>

        </details>
        </div>
        <div class="dialogButtons">
            <button id="imageDialogOkButton">Select</button>
            <button id="imageDialogClearButton">Clear</button>
            <button id="imageDialogCancelButton">Cancel</button>
        </div>
    </dialog>

    <script src="js/lib/argb-picker.js"></script>
    <script type="module" src="js/sidepanel_menu_controller.js"></script>
    <script type="module" src="js/setup.js"></script>
    <script type="module" src="js/shared_state.js"></script>
    <script type="module" src="js/shared_state_setup.js"></script>
    <script type="module" src="js/table_controller.js"></script>
    <script type="module" src="js/operation_panel_controller.js"></script>
    <script type="module" src="js/operation_editor.js"></script>
    <script type="module" src="js/integration_dialog.js"></script>
    <script type="module" src="js/integration_controller.js"></script>
    <script type="module" src="js/menu_controller.js"></script>
    <script type="module" src="js/sheet_menu_controller.js"></script>
    <script type="module" src="js/user_input_controller.js"></script>
    <script type="module" src="js/details_controller.js"></script>
    <script type="module" src="js/sync.js"></script>
</body>
</html>
