<svg width="100" height="100"
     xmlns="http://www.w3.org/2000/svg"
     xmlns:param="http://kobjects.org/svg/param">
    <param:def name="active" type="Boolean" />
    <circle cx="50" cy="50" r="48"
            param:fill="active ? 'yellow' : 'white'"
            fill="white" stroke-width="5"
            stroke="black" />

    <polyline points="100,50 0,50" stroke="black" stroke-width="2"/>
    <text x="50" y="40" text-anchor="middle" style="font-family:sans-serif; font-size:30">L</text>
</svg>