<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
<symbol id="lamp" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="47" stroke-width="5" stroke="black" />
    <line x1="17" y1="17" x2="83" y2="83" stroke="black" stroke-width="5" />
    <line x1="17" y1="83" x2="83" y2="17" stroke="black" stroke-width="5" />
</symbol>

<symbol id="mixer.d" viewBox="0 0 100 100">
    <path d="M 50,50 C 0,0 0,100 50,50 C 100,0, 100,100, 50,50"
      fill="none" stroke-width="5"
      stroke="black" />
    <polyline points="50,100 50,50" stroke="black" stroke-width="5"/>
</symbol>

<symbol id="mixer.u" viewBox="0 0 100 100">
    <path d="M 50,50 C 0,0 0,100 50,50 C 100,0, 100,100, 50,50"
      fill="none" stroke-width="5"
      stroke="black" />
    <polyline points="50,0 50,50" stroke="black" stroke-width="5"/>
</symbol>

<symbol id="motor" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="47"
        fill="white" stroke-width="5"
        stroke="black" />
    <polyline points="30,80 30,20 50,80 70,20 70,80" fill="none" stroke-linejoin="bevel" stroke="black" stroke-width="5"/>
</symbol>

<symbol id="sensor.level" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="48"
        fill="none" stroke-width="5"
        stroke="black" />
    <polyline points="100,50 0,50" stroke="black" stroke-width="2"/>
    <text x="50" y="40" text-anchor="middle" style="font-family:sans-serif; font-size:30">L</text>
</symbol>

<symbol id="valve.h" viewBox="0 0 100 100">
    <polygon points="10,20 90,80 90,20 10,80"
         fill="white" stroke-width="5"
         stroke="black" />
    <polyline points="0,50 10,50" stroke="black" stroke-width="5"/>
    <polyline points="90,50 100,50" stroke="black" stroke-width="5"/>
</symbol>


<symbol id="valve.v" viewBox="0 0 100 100">
    <polygon points="20,10 80,10 20,90 80,90"
             fill="white" stroke-width="5"
             stroke="black" />
    <polyline points="50,0 50,10" stroke="black" stroke-width="5" />
    <polyline points="50,100 50,90" stroke="black" stroke-width="5" />
</symbol>

</svg>
