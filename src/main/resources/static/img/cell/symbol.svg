<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
<symbol id="box" viewBox="0 0 100 100">
    <rect x="0" y="0" width="100" height="100" fill="currentColor" />
</symbol>

<symbol id="lamp" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="47" fill="none" stroke-width="5" stroke="currentColor" />
    <line x1="17" y1="17" x2="83" y2="83" stroke="currentColor" stroke-width="5" />
    <line x1="17" y1="83" x2="83" y2="17" stroke="currentColor" stroke-width="5" />
</symbol>

<symbol id="mixer" viewBox="0 0 100 100">
    <path d="M 50,50 C 0,0 0,100 50,50 C 100,0, 100,100, 50,50"
      fill="none" stroke-width="5"
      stroke="currentColor" />
    <polyline points="50,100 50,50" stroke="currentColor" stroke-width="5"/>
</symbol>

<symbol id="motor" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="47"
        fill="none" stroke-width="5"
        stroke="currentColor" />
    <polyline points="30,80 30,20 50,80 70,20 70,80" fill="none" stroke-linejoin="bevel" stroke="currentColor" stroke-width="5"/>
</symbol>

<symbol id="sensor" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="48"
        fill="none" stroke-width="5"
        stroke="currentColor" />
    <polyline points="100,50 0,50" stroke="currentColor" stroke-width="2"/>
</symbol>

<symbol id="valve" viewBox="0 0 100 100">
    <polygon points="10,20 90,80 90,20 10,80"
         fill="none" stroke-width="5"
         stroke="currentColor" />
    <polyline points="0,50 10,50" stroke="currentColor" stroke-width="5"/>
    <polyline points="90,50 100,50" stroke="currentColor" stroke-width="5"/>
</symbol>
</svg>
