<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
<defs>
    <symbol id="straight" viewBox="0 0 100 100">
        <line x1="0" y1="50" x2="100" y2="50" stroke="currentColor" stroke-width="5" />
    </symbol>

    <symbol id="corner" viewBox="0 0 100 100">
        <line x1="50" y1="50" x2="50" y2="100" stroke="currentColor" stroke-width="5" />
        <line x1="0" y1="50" x2="50" y2="50" stroke="currentColor" stroke-width="5" />
    </symbol>

    <symbol id="arc" viewBox="0 0 100 100">
        <path d="M 0,50 Q 50,50 50,100" fill="none" stroke="currentColor" stroke-width="5" />
    </symbol>

    <symbol id="diagonal" viewBox="0 0 100 100">
        <line x1="0" y1="50" x2="50" y2="100" stroke="currentColor" stroke-width="5" />
    </symbol>

    <symbol id="t" viewBox="0 0 100 100">
        <line x1="50" y1="50" x2="50" y2="100" stroke="currentColor" stroke-width="5" />
        <line x1="0" y1="50" x2="100" y2="50" stroke="currentColor" stroke-width="5" />
    </symbol>

    <symbol id="cross" viewBox="0 0 100 100">
        <line x1="50" y1="0" x2="50" y2="100" stroke="currentColor" stroke-width="5" />
        <line x1="0" y1="50" x2="100" y2="50" stroke="currentColor" stroke-width="5" />
    </symbol>
</defs>
</svg>
